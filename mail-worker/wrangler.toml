name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# =====================================================================
# 生产绑定（写进配置 = 每次部署由 Cloudflare 自动绑定，无需在面板手工添加）
#   D1: email（database_id 950828e9-…）  KV: email（id 2fe4f308…）
#   绑定 ID 只是资源标识、不是密钥；密钥/密码仍只放环境变量与 Secrets。
#   ⚠️ 若删掉这里的绑定，从配置部署（含 Workers Builds）时该绑定可能不再生效。
# =====================================================================
[[d1_databases]]
binding = "db"						#d1数据库绑定名默认不可修改
database_name = "email"				#d1数据库名字
database_id = "950828e9-c02c-4b30-80fd-10f442ce853b"	#d1数据库id

[[kv_namespaces]]
binding = "kv"						#kv绑定名默认不可修改
id = "2fe4f308183e4c44b162469e787178b5"	#kv数据库id

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *", "*/5 * * * *"]	#每天晚上12点执行每日任务,刷新分析缓存；每5分钟尝试把 COS 恢复后的回退附件迁回 COS


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""					#管理员的邮箱	示例: admin@example.com
#jwt_secret = ""			#jwt令牌的密钥,随便填一串字符串

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
